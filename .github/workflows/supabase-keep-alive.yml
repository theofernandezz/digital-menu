name: Supabase Keep-Alive

# Supabase pauses Free Plan projects after a week of low activity, and its
# own docs put the bar at "a few user requests to the database each day
# over the previous week" — not "at least once within 7 days". This
# project's only Supabase traffic otherwise comes from CI runs
# (docker-compose.yml:docker-compose.ci.yml pnpm test:integration), which
# only fire on push/PR — quiet weeks mean quiet Supabase. A previous
# every-4-days schedule still let the project get paused, so this runs
# daily instead.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        run: |
          curl -sf --retry 3 --retry-delay 10 --retry-all-errors \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            > /dev/null
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
